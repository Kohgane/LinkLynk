  .dcard.on{background:rgba(255,180,80,.85);color:#1a0f00;font-weight:700;border-color:transparent}
  .vcard.on{background:rgba(150,240,170,.88);color:#02240c;font-weight:700;border-color:transparent}
  #row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .btn.on{background:rgba(120,200,255,.8);color:#00121f;font-weight:700}
  #timeWrap{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
  #timeSlider{flex:1;accent-color:#ffb450}

  #custWrap{display:none;align-items:center;gap:10px;font-size:12px;color:#dfd}
  #custWrap input{accent-color:#9fe6a0;width:110px}
    #joyWrap{display:none}
  #joy{position:fixed;left:18px;bottom:170px;width:120px;height:120px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);z-index:11;touch-action:none}
  #joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
  #lookPad{position:fixed;right:0;bottom:160px;width:46%;height:52%;z-index:10;touch-action:none}
  .tbtn{position:fixed;right:16px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px;z-index:11;touch-action:none}
  #btnUp{bottom:300px}#btnDn{bottom:236px}
  #btnBoost{bottom:172px;background:rgba(255,180,80,.35);font-size:11px;font-weight:700}
  #tracks{display:none;gap:8px;overflow-x:auto;padding-bottom:4px}
  #tracks.show{display:flex}
  .tcard{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:rgba(255,120,180,.18);
    border:1px solid rgba(255,150,200,.4);font-size:13px;white-space:nowrap;cursor:pointer;color:#fff}
  #raceHud{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:12;color:#fff;
    font-size:20px;font-weight:800;text-shadow:0 2px 8px #000;display:none;text-align:center;line-height:1.5}
  #raceHud small{font-size:12px;font-weight:400;opacity:.85}
  #hint{top:14px;right:16px;font-size:11px;text-align:right;opacity:.6;line-height:1.7;text-shadow:0 1px 4px #000}
  #tier{position:fixed;top:44px;left:16px;font-size:11px;opacity:.55;color:#ffd9a0;z-index:10}
  .cesium-viewer-bottom{opacity:.4}
</style>
</head>
<body>

<div class="hud" id="title">EARTHFLIGHT</div>
<div class="hud" id="vehHud"></div>
<div id="raceHud"></div>
<div id="statsBox" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
 z-index:20;background:rgba(10,12,30,.92);border:1px solid rgba(255,255,255,.25);border-radius:16px;
 padding:22px 26px;color:#fff;font-size:14px;line-height:2;min-width:250px;backdrop-filter:blur(8px)"></div>

</div>

  <div id="dests"></div>
  <div id="tracks"></div>

  <div id="row2">

    <button class="btn" id="btnRace">🏁 레이스</button>
    <button class="btn" id="btnStats">📊</button>

    <div id="timeWrap">
      <span style="font-size:16px">☀️</span>
      <input type="range" id="timeSlider" min="0" max="24" step="0.1" value="17.5">

<script>

/* ================================================== */

  {n:"그레이트배리어리프",lon:148.95,lat:-20.28,h:1500, r:12000, p:-30},
  {n:"레이크루이스(밴프)",lon:-116.217,lat:51.417,h:2300,r:6000, p:-18},
  {n:"나이아가라",   lon:-79.075, lat:43.078,  h:400,   r:2800,  p:-24},

const VEHICLES = [

  {n:"전투기",e:"\uD83D\uDEE9\uFE0F",sp:3.0,ag:1.5},
  {n:"여객기",e:"\uD83D\uDEEB",sp:1.8,ag:0.5},
  {n:"헬리콥터",e:"\uD83D\uDE81",sp:0.6,ag:1.8},
  {n:"글라이더",e:"\uD83E\uDE82",sp:0.45,ag:1.2},
  {n:"패러글라이더",e:"\uD83C\uDFCB\uFE0F",sp:0.3,ag:1.5},
  {n:"열기구",e:"\uD83C\uDF88",sp:0.15,ag:0.5},
  {n:"드론",e:"\uD83D\uDEF8",sp:0.5,ag:2.5},
  {n:"복엽기",e:"\uD83D\uDEE9",sp:0.8,ag:1.1},
  {n:"로켓",e:"\uD83D\uDE80",sp:6.0,ag:0.5,cat:"space"},
  {n:"우주왕복선",e:"\uD83D\uDEF0\uFE0F",sp:5.0,ag:0.8,cat:"space"},
  {n:"UFO",e:"\uD83D\uDEF8",sp:4.5,ag:3.0,cat:"space"},
  {n:"스포츠카",e:"\uD83C\uDFCE\uFE0F",sp:1.2,ag:1.5,cat:"ground",off:2},
  {n:"오토바이",e:"\uD83C\uDFCD\uFE0F",sp:1.0,ag:2.0,cat:"ground",off:2},
  {n:"오프로드",e:"\uD83D\uDEFB",sp:0.8,ag:1.6,cat:"ground",off:3},
  {n:"기차",e:"\uD83D\uDE84",sp:1.5,ag:0.3,cat:"ground",off:4},
  {n:"탱크",e:"\uD83D\uDEE1\uFE0F",sp:0.5,ag:0.8,cat:"ground",off:3},
  {n:"말",e:"\uD83D\uDC0E",sp:0.3,ag:1.8,cat:"ground",off:2},
  {n:"치타",e:"\uD83D\uDC06",sp:0.6,ag:2.5,cat:"ground",off:1},
  {n:"자전거",e:"\uD83D\uDEB2",sp:0.15,ag:1.5,cat:"ground",off:2},
  {n:"쾌속정",e:"\uD83D\uDEA4",sp:0.9,ag:1.5,cat:"sea",off:2},
  {n:"요트",e:"\u26F5",sp:0.4,ag:0.8,cat:"sea",off:3},
  {n:"항공모함",e:"\uD83D\uDEA2",sp:0.6,ag:0.2,cat:"sea",off:15},
  {n:"서핑보드",e:"\uD83C\uDFC4",sp:0.3,ag:2.0,cat:"sea",off:1},

  {n:"모래벌레",e:"\uD83E\uDEB1",sp:1.2,ag:1.0,cat:"tunnel"},
  {n:"용",e:"\uD83D\uDC09",sp:1.6,ag:1.6},
  {n:"그리핀",e:"\uD83E\uDD85",sp:1.2,ag:2.0},
  {n:"페가수스",e:"\uD83E\uDD84",sp:1.4,ag:1.8},
  {n:"불사조",e:"\uD83D\uDD25",sp:2.5,ag:2.0},
  {n:"마법양탄자",e:"\uD83E\uDDDE",sp:1.0,ag:2.0},
  {n:"빗자루",e:"\uD83E\uDDF9",sp:1.3,ag:2.4},
  {n:"근두운",e:"\u2601\uFE0F",sp:3.2,ag:1.4},
  {n:"산타썰매",e:"\uD83E\uDD8C",sp:2.0,ag:1.2},
  {n:"종이비행기",e:"\uD83D\uDCC4",sp:0.4,ag:2.2},
  {n:"커스텀",e:"\u2699\uFE0F",sp:1.0,ag:1.0,custom:true},
];

let viewer, tier = "BASIC (키 없음: 평면지형)";
let mode = "tour", veh = VEHICLES[0];
let layerMode = false;
let curIdx = -1, orbiting = false, orbitHeading = 0, orbitCenter = null, orbitR = 0, orbitP = 0;
let lastT = 0;
const keys = {};
const touch={jx:0,jy:0,sjx:0,sjy:0,lx:0,ly:0,up:0,boost:false};
const IS_TOUCH=('ontouchstart' in window);

async function init(){
  const opts = {
    animation:false, timeline:false, baseLayerPicker:false, geocoder:false,
    homeButton:false, sceneModePicker:false, navigationHelpButton:false,
    fullscreenButton:false, infoBox:false, selectionIndicator:false,
    requestRenderMode:false,
    contextOptions:{webgl:{preserveDrawingBuffer:true}},
  };
  if (CESIUM_ION_TOKEN){
    Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
    opts.terrain = Cesium.Terrain.fromWorldTerrain();
    viewer = new Cesium.Viewer("cesiumContainer", opts);
    tier = "TERRAIN (Cesium World Terrain)";
  } else {
    opts.baseLayer = new Cesium.ImageryLayer(new Cesium.UrlTemplateImageryProvider({
      url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      credit:"Esri World Imagery", maximumLevel:18
    }));
    viewer = new Cesium.Viewer("cesiumContainer", opts);
  }
  if (GOOGLE_KEY){
    try{
      Cesium.GoogleMaps.defaultApiKey = GOOGLE_KEY;
      const g = await Cesium.createGooglePhotorealistic3DTileset();
      viewer.scene.primitives.add(g);
      viewer.scene.globe.show = false;
      tier = "PHOTOREAL (Google 3D Tiles)";
    }catch(e){ console.warn("Google tiles 실패", e); }
  }
  const sc = viewer.scene;
  sc.globe.enableLighting = true;
  sc.globe.atmosphereLightIntensity = 22;
  sc.skyAtmosphere.show = true;
  sc.fog.enabled = true;
  sc.globe.depthTestAgainstTerrain = true;
  sc.screenSpaceCameraController.enableCollisionDetection = true;
  viewer.clock.shouldAnimate = true;
  if (IS_TOUCH){
    viewer.resolutionScale = 0.7;
    sc.globe.maximumScreenSpaceError = 4;
    sc.postProcessStages.fxaa.enabled = false;
    sc.highDynamicRange = false;
    sc.msaaSamples = 1;
    sc.globe.tileCacheSize = 200;
  }

  document.getElementById("tier").textContent = tier;
  buildUI();
  const q=new URLSearchParams(location.search);
  if(q.has("lon")){
    timeSlider.value=q.get("t")||"17.5";
    viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(+q.get("lon"),+q.get("lat"),+q.get("h")||3000),
      orientation:{heading:+q.get("hd")||0,pitch:+q.get("pt")||-0.3,roll:0}});
    setLocalTime(parseFloat(timeSlider.value));
    goFree();
  } else {
    setLocalTime(17.5);
    goSpace(true);
    setTimeout(()=>flyToDest(0), 2500);
  }
  viewer.clock.onTick.addEventListener(tick);
  setupInput();
  setupTouch();
}

function setupTouch(){
  if(!IS_TOUCH) return;
  const joy=document.getElementById("joy"), knob=document.getElementById("joyKnob");
  let jid=null,cx=0,cy=0;
  joy.addEventListener("touchstart",e=>{const t=e.changedTouches[0];jid=t.identifier;
    const r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;e.preventDefault();},{passive:false});
  joy.addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier===jid){
    let dx=(t.clientX-cx)/50, dy=(t.clientY-cy)/50;const m=Math.hypot(dx,dy);
    if(m>1){dx/=m;dy/=m;} touch.jx=dx;touch.jy=dy;
    knob.style.transform="translate("+(dx*40)+"px,"+(dy*40)+"px)";}}e.preventDefault();},{passive:false});
  const jend=e=>{for(const t of e.changedTouches){if(t.identifier===jid){jid=null;touch.jx=touch.jy=0;knob.style.transform="";}}};
  joy.addEventListener("touchend",jend); joy.addEventListener("touchcancel",jend);
  const pad=document.getElementById("lookPad");
  let lid=null,px=0,py=0;
  pad.addEventListener("touchstart",e=>{const t=e.changedTouches[0];lid=t.identifier;px=t.clientX;py=t.clientY;e.preventDefault();},{passive:false});
  pad.addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier===lid){
    touch.lx+=(t.clientX-px)*0.0022; touch.ly+=(t.clientY-py)*0.0022; px=t.clientX;py=t.clientY;}}e.preventDefault();},{passive:false});
  const lend=e=>{for(const t of e.changedTouches){if(t.identifier===lid)lid=null;}};
  pad.addEventListener("touchend",lend); pad.addEventListener("touchcancel",lend);
  const hold=(id,prop,val)=>{const el=document.getElementById(id);
    el.addEventListener("touchstart",e=>{touch[prop]=val;e.preventDefault();},{passive:false});
    const off=()=>{touch[prop]=(prop==="boost")?false:0;};
    el.addEventListener("touchend",off); el.addEventListener("touchcancel",off);};
  hold("btnUp","up",1); hold("btnDn","up",-1); hold("btnBoost","boost",true);
}

function setLocalTime(h){
  const lon = Cesium.Math.toDegrees(viewer.camera.positionCartographic.longitude) || 0;
  let utc = h - lon/15;
  const d = new Date();
  const base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) + utc*3600*1000;
  viewer.clock.currentTime = Cesium.JulianDate.fromDate(new Date(base));
  const hh = String(Math.floor(h)%24).padStart(2,"0"), mm = String(Math.round((h%1)*60)).padStart(2,"0");
  document.getElementById("timeLabel").textContent = hh+":"+mm;
}

const stats=JSON.parse(localStorage.getItem("ef_stats")||'{"visits":{},"dist":0}');
function saveStats(){localStorage.setItem("ef_stats",JSON.stringify(stats));}
let statTimer=0;

function flyToDest(i){
  stats.visits[DESTS[i].n]=(stats.visits[DESTS[i].n]||0)+1; saveStats();
  const d = DESTS[i]; curIdx = i; mode = "tour"; orbiting = false; syncBtns();
  document.querySelectorAll(".dcard").forEach((c,j)=>c.classList.toggle("on", j===i));
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  orbitCenter = Cesium.Cartesian3.fromDegrees(d.lon, d.lat, d.h*0.35);
  orbitR = d.r; orbitP = Cesium.Math.toRadians(d.p); orbitHeading = Cesium.Math.toRadians(20);
  viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(orbitCenter, d.r), {
    duration: 5,
    offset: new Cesium.HeadingPitchRange(orbitHeading, orbitP, d.r),
    complete: ()=>{ orbiting = true; setLocalTime(parseFloat(timeSlider.value)); }
  });
}

function goSpace(instant){
  mode = "space"; orbiting = false; curIdx = -1; syncBtns();
  document.querySelectorAll(".dcard").forEach(c=>c.classList.remove("on"));
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  const dst = Cesium.Cartesian3.fromDegrees(127, 20, 22000000);
  if (instant) viewer.camera.setView({destination:dst});
  else viewer.camera.flyTo({destination:dst, duration:5});
}

function goFree(){
  mode = "free"; orbiting = false; syncBtns();
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  document.querySelectorAll(".dcard").forEach(c=>c.classList.remove("on"));
}

function curSpeed(){
  const h = Math.max(viewer.camera.positionCartographic.height, 1);
  const base = Math.min(Math.max(h*0.8, 100), 200000);
  return base * veh.sp * ((keys.shift||touch.boost) ? 10 : 1);
}
function tick(){
  const now = performance.now();
  const dt = lastT ? Math.min((now-lastT)/1000, 0.1) : 1/60;
  lastT = now;
  raceTick(dt);
  if (mode === "tour" && orbiting && orbitCenter){
    orbitHeading += 0.1*dt;
    viewer.camera.lookAt(orbitCenter, new Cesium.HeadingPitchRange(orbitHeading, orbitP, orbitR));
  }
  if (mode === "free"){
    if(!tick._pp) tick._pp=viewer.camera.position.clone();
    const _mv=Cesium.Cartesian3.distance(tick._pp,viewer.camera.position);
    if(_mv>0.5&&_mv<500000){stats.dist+=_mv; statTimer+=dt;
      if(statTimer>5){saveStats();statTimer=0;}}
    tick._pp=viewer.camera.position.clone();
    const c = viewer.camera, sp = curSpeed()*dt, tr = 1.4*veh.ag*dt, tp = 0.8*veh.ag*dt;
    if (keys.w) c.moveForward(sp);
    if (keys.s) c.moveBackward(sp);
    if (keys.a) c.moveLeft(sp*0.7);
    if (keys.d) c.moveRight(sp*0.7);
    if (keys.q) c.moveDown(sp*0.5);
    if (keys.e) c.moveUp(sp*0.5);
    if (keys.arrowleft)  c.lookLeft(tr);
    if (keys.arrowright) c.lookRight(tr);
    if (keys.arrowup)    c.lookUp(tp);
    if (keys.arrowdown)  c.lookDown(tp);
    touch.sjx+=(touch.jx-touch.sjx)*0.18; touch.sjy+=(touch.jy-touch.sjy)*0.18;
    if (Math.abs(touch.sjy)>0.01){ touch.sjy<0 ? c.moveForward(sp*-touch.sjy) : c.moveBackward(sp*touch.sjy); }
    if (Math.abs(touch.sjx)>0.01){ touch.sjx>0 ? c.moveRight(sp*0.7*touch.sjx) : c.moveLeft(sp*0.7*-touch.sjx); }
    if (touch.up){ touch.up>0 ? c.moveUp(sp*0.5) : c.moveDown(sp*0.5); }
    if (touch.lx||touch.ly){
      c.lookRight(touch.lx*0.35); c.lookUp(-touch.ly*0.35);
      touch.lx*=0.62; touch.ly*=0.62;
      if(Math.abs(touch.lx)<0.0001)touch.lx=0;
      if(Math.abs(touch.ly)<0.0001)touch.ly=0;
    }
    clampToLayer(c);
    vehHud.textContent = `${veh.e} ${veh.n} \u00B7 ${Math.round(curSpeed()*3.6).toLocaleString()} km/h`;
  }
}

function clampToLayer(c){
  if (!layerMode) return;
  const cat = veh.cat || "air";
  if (cat==="air" || cat==="space") return;
  const cart = c.positionCartographic;
  let target = null;
  const g = viewer.scene.globe.getHeight(cart);
  if (cat==="ground"){
    if (g !== undefined) target = g + (veh.off||3);
  } else if (cat==="sea"){
    target = (veh.off||2);
  } else if (cat==="sub"){
    target = Math.min(cart.height, -3);
    if (g !== undefined && g < -10) target = Math.max(target, g+5);
  } else if (cat==="tunnel"){
    target = Math.min(cart.height, (g===undefined?0:g) - 10);
  }
  if (target === null) return;
  const h = cart.height + (target - cart.height)*0.12;
  c.setView({
    destination: Cesium.Cartesian3.fromRadians(cart.longitude, cart.latitude, h),
    orientation: { heading: c.heading, pitch: c.pitch, roll: 0 }
  });
}



/* ---------------- RACING ---------------- */
const TRACKS=[
 {n:"🏜️ 협곡런 (그랜드캐니언)",r:420,gates:[[-112.155,36.093,2100],[-112.135,36.083,2000],[-112.113,36.079,1950],[-112.094,36.088,2050],[-112.078,36.101,2150],[-112.096,36.113,2250],[-112.121,36.117,2200],[-112.145,36.106,2150]]},
 {n:"🏔️ 마터호른 서킷",r:620,gates:[[7.62,45.99,4700],[7.645,46.005,4900],[7.678,46.0,5100],[7.695,45.978,5200],[7.678,45.955,5000],[7.645,45.95,4800],[7.62,45.965,4700]]},
 {n:"🚀 성층권 강하",r:1600,gates:[[138.731,35.363,42000],[138.74,35.37,30000],[138.75,35.36,20000],[138.74,35.35,12000],[138.735,35.358,6500],[138.731,35.363,4600]]},
 {n:"\uD83C\uDFDD\uFE0F \uD558\uB871\uBCA0\uC774 \uC2AC\uB7EC\uB86C".replace(/\\u/g,"").length?"\uD83C\uDFDD\uFE0F \uD558\uB871\uBCA0\uC774 \uC2AC\uB7EC\uB86C":"",r:380,gates:[[107.00,20.95,350],[107.02,20.93,300],[107.045,20.915,260],[107.07,20.90,300],[107.09,20.885,340],[107.07,20.865,300],[107.045,20.87,280],[107.02,20.885,320]]},
 {n:"\uD83C\uDF06 \uB9AC\uC6B0 \uD574\uC548 \uC11C\uD0B7",r:450,gates:[[-43.21,-22.94,600],[-43.19,-22.955,450],[-43.165,-22.95,380],[-43.155,-22.935,500],[-43.17,-22.92,650],[-43.195,-22.925,700],[-43.21,-22.94,600]]}
];
let race={on:false,ti:-1,gi:0,t0:0,samples:[],ents:[],ghostEnt:null,best:null,countdown:0};
const raceHud=document.getElementById("raceHud");

let AC=null;
function snd(f,d,t,v){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;
 g.gain.setValueAtTime(v||0.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
 o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sndGate(){snd(880,0.12,"sine",0.2);snd(1320,0.18,"sine",0.1);}
function sndTick(){snd(440,0.1,"square",0.12);}
function sndGo(){snd(660,0.3,"square",0.15);}
function sndWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,0.25,"triangle",0.18),i*140));}

function shareLink(){
  const c=viewer.camera,pc=c.positionCartographic;
  return location.origin+"/fly/?lon="+Cesium.Math.toDegrees(pc.longitude).toFixed(5)
    +"&lat="+Cesium.Math.toDegrees(pc.latitude).toFixed(5)+"&h="+Math.round(pc.height)
    +"&hd="+c.heading.toFixed(3)+"&pt="+c.pitch.toFixed(3)+"&t="+timeSlider.value;
}
async function photo(){
  viewer.scene.render();
  const src=viewer.canvas, c=document.createElement("canvas");
  c.width=src.width; c.height=src.height;
  const x=c.getContext("2d"); x.drawImage(src,0,0);
  x.fillStyle="rgba(0,0,0,.45)"; x.fillRect(0,c.height-64,c.width,64);
  x.fillStyle="#fff"; x.font="bold "+Math.round(c.height*0.028)+"px sans-serif";
  const d=curIdx>=0?DESTS[curIdx].n+" \u00B7 ":"";
  x.fillText("EARTHFLIGHT  "+d+document.getElementById("timeLabel").textContent, 24, c.height-24);
  const url=c.toDataURL("image/jpeg",0.92);
  const link=shareLink();
  try{ await navigator.clipboard.writeText(link);}catch(e){}
  if(navigator.share){
    try{const blob=await (await fetch(url)).blob();
      await navigator.share({files:[new File([blob],"earthflight.jpg",{type:"image/jpeg"})],
        title:"Earthflight", text:"\uB0B4 \uC9C0\uAD6C\uBE44\uD589 \u2708\uFE0F "+link});
      return;}catch(e){}
  }
  const aa=document.createElement("a"); aa.href=url; aa.download="earthflight.jpg"; aa.click();
}

function gatePos(g){return Cesium.Cartesian3.fromDegrees(g[0],g[1],g[2]);}

function clearRaceEnts(){
  race.ents.forEach(e=>viewer.entities.remove(e)); race.ents=[];
  if(race.ghostEnt){viewer.entities.remove(race.ghostEnt);race.ghostEnt=null;}
}

function startRace(i){
  const T=TRACKS[i];
  goFree(); race.on=true; race.ti=i; race.gi=0; race.samples=[]; clearRaceEnts();
  race.best=JSON.parse(localStorage.getItem("ef_best_"+i)||"null");
  T.gates.forEach((g,j)=>{
    const pos=gatePos(g);
    const tgt=j<T.gates.length-1?gatePos(T.gates[j+1]):gatePos(T.gates[j-1]);
    const dir=Cesium.Cartesian3.subtract(tgt,pos,new Cesium.Cartesian3());
    const inv=Cesium.Matrix4.inverseTransformation(Cesium.Transforms.eastNorthUpToFixedFrame(pos),new Cesium.Matrix4());
    const loc=Cesium.Matrix4.multiplyByPointAsVector(inv,dir,new Cesium.Cartesian3());
    const ori=Cesium.Transforms.headingPitchRollQuaternion(pos,new Cesium.HeadingPitchRoll(Math.atan2(loc.x,loc.y),0,0));
    race.ents.push(viewer.entities.add({position:pos,orientation:ori,
      ellipsoid:{radii:new Cesium.Cartesian3(T.r,T.r*0.22,T.r),
        material:Cesium.Color.CYAN.withAlpha(0.22),
        outline:true,outlineColor:Cesium.Color.CYAN.withAlpha(0.7)}}));
  });
  highlightGate();
  if(race.best&&race.best.path&&race.best.path.length>1){
    race.ghostEnt=viewer.entities.add({polyline:{positions:race.best.path.map(q=>new Cesium.Cartesian3(q[0],q[1],q[2])),
      width:3,material:Cesium.Color.GOLD.withAlpha(0.55)}});
  }
  const s0=T.gates[0];
  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(s0[0],s0[1]-0.03,s0[2]+300),
    orientation:{heading:0,pitch:Cesium.Math.toRadians(-5),roll:0}});
  viewer.camera.lookAt(gatePos(s0), new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-4),3000));
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  race.countdown=3.999; race.cdl=99; raceHud.style.display="block";
}

function highlightGate(){
  race.ents.forEach((e,j)=>{
    const cur=j===race.gi;
    e.ellipsoid.material=(j<race.gi?Cesium.Color.LIME:cur?Cesium.Color.ORANGE:Cesium.Color.CYAN).withAlpha(cur?0.35:0.18);
    e.ellipsoid.outlineColor=(cur?Cesium.Color.ORANGE:Cesium.Color.CYAN).withAlpha(0.8);
  });
}

function endRace(finished){
  if(finished){
    const t=(performance.now()-race.t0)/1000;
    const prev=race.best?race.best.time:Infinity;
    let msg="⏱ "+t.toFixed(2)+"s";
    if(t<prev){ localStorage.setItem("ef_best_"+race.ti,JSON.stringify({time:t,path:race.samples}));
      msg+="<br><small>🏆 신기록!"+(isFinite(prev)?" (이전 "+prev.toFixed(2)+"s)":"")+"</small>"; }
    else msg+="<br><small>베스트 "+prev.toFixed(2)+"s</small>";
    sndWin();
    raceHud.innerHTML=msg;
    setTimeout(()=>{raceHud.style.display="none";},4500);
  } else raceHud.style.display="none";
  race.on=false; clearRaceEnts();
}

function raceTick(dt){
  if(!race.on) return;
  if(race.countdown>0){
    race.countdown-=dt;
    const fl=Math.floor(race.countdown);
    if(fl!==race.cdl){race.cdl=fl; fl>=1?sndTick():sndGo();}
    raceHud.innerHTML=race.countdown>1?("🏁 "+Math.floor(race.countdown)):"GO!";
    if(race.countdown<=0){race.t0=performance.now();}
    return;
  }
  const T=TRACKS[race.ti], el=(performance.now()-race.t0)/1000;
  const cp=viewer.camera.position;
  if(race.samples.length===0||el-race.samples[race.samples.length-1][3]>0.25)
    race.samples.push([cp.x,cp.y,cp.z,el]);
  const d=Cesium.Cartesian3.distance(cp,gatePos(T.gates[race.gi]));
  if(d<T.r){
    sndGate();
    race.gi++;
    if(race.gi>=T.gates.length){endRace(true);return;}
    highlightGate();
  }
  raceHud.innerHTML="⏱ "+el.toFixed(1)+"s<br><small>게이트 "+race.gi+"/"+T.gates.length+" · 주황 구체로!</small>";
}

function setupInput(){
  const map={KeyW:"w",KeyA:"a",KeyS:"s",KeyD:"d",KeyQ:"q",KeyE:"e",
    ShiftLeft:"shift",ShiftRight:"shift",ArrowLeft:"arrowleft",
    ArrowRight:"arrowright",ArrowUp:"arrowup",ArrowDown:"arrowdown"};
  addEventListener("keydown", e=>{ const k=map[e.code];
    if(k){ keys[k]=true; e.preventDefault(); } });
  addEventListener("keyup", e=>{ const k=map[e.code]; if(k) keys[k]=false; });
}

function syncBtns(){
  btnTour.classList.toggle("on", mode==="tour");
  btnFree.classList.toggle("on", mode==="free");
  btnSpace.classList.toggle("on", mode==="space");
  vehHud.style.display = mode==="free" ? "block" : "none";
  document.getElementById("joyWrap").style.display = (IS_TOUCH && mode==="free") ? "block" : "none";
  document.getElementById("hint").innerHTML = mode==="free"
    ? "W/A/S/D 이동 · Q/E 고도 · 방향키 시선 · Shift 부스터<br>높이 날수록 빨라짐 · 마우스 드래그 회전"
    : (mode==="tour" ? "명소 카드를 눌러 이동 · 자동 선회 중" : "지구를 드래그해 회전 · 휠로 접근");
}

function pickVeh(i){
  veh = VEHICLES[i];
  document.querySelectorAll(".vcard").forEach((c,j)=>c.classList.toggle("on", j===i));
  custWrap.style.display = veh.custom ? "flex" : "none";
  if (veh.custom){ veh.sp=parseFloat(custSp.value); veh.ag=parseFloat(custAg.value); }
  const under = layerMode && (veh.cat==="sub" || veh.cat==="tunnel");
  const gl = viewer.scene.globe;
  gl.translucency.enabled = under;
  gl.translucency.frontFaceAlpha = under ? 0.45 : 1.0;
  viewer.scene.screenSpaceCameraController.enableCollisionDetection = !under && !(layerMode && veh.cat==="ground");
  goFree();
}


function buildUI(){
  const vw = document.getElementById("vehs");
  VEHICLES.forEach((v,i)=>{
    const el = document.createElement("div");
    el.className = "vcard"; el.textContent = v.e+" "+v.n;
    el.onclick = ()=>pickVeh(i);
    vw.appendChild(el);

    el.className = "dcard"; el.textContent = d.n;

    wrap.appendChild(el);
  });

    el.textContent=t.n;el.onclick=()=>{tw.classList.remove("show");startRace(i);};tw.appendChild(el);});

    layerMode = !layerMode;

    const under = layerMode && (veh.cat==="sub"||veh.cat==="tunnel");

    gl.translucency.enabled = under;
    gl.translucency.frontFaceAlpha = under?0.45:1.0;
    viewer.scene.screenSpaceCameraController.enableCollisionDetection = !under && !(layerMode && veh.cat==="ground");
  };
  document.getElementById("btnPhoto").onclick=photo;
  document.getElementById("btnStats").onclick=()=>{
    const b=document.getElementById("statsBox");
    if(b.style.display==="block"){b.style.display="none";return;}
    const v=Object.keys(stats.visits).length;
    let bests="";
    TRACKS.forEach((t,i)=>{const r=JSON.parse(localStorage.getItem("ef_best_"+i)||"null");
      if(r)bests+="<br>"+t.n+" \u2014 <b>"+r.time.toFixed(2)+"s</b>";});

      +"\uBC29\uBB38 \uBA85\uC18C: <b>"+v+"</b> / "+DESTS.length
      +"<br>\uCD1D \uBE44\uD589\uAC70\uB9AC: <b>"+(stats.dist/1000).toFixed(1)+" km</b>"
      +(bests?"<br><br><b>\uD83C\uDFC1 \uBCA0\uC2A4\uD2B8</b>"+bests:"")
      +"<br><br><span style=\"opacity:.6;font-size:12px\">\uD0ED\uD558\uBA74 \uB2EB\uD798</span>";
    b.style.display="block";
    b.onclick=()=>b.style.display="none";
  };
  timeSlider.oninput = e=>setLocalTime(parseFloat(e.target.value));
  custSp.oninput = e=>{ custSpv.textContent=(+e.target.value).toFixed(1)+"×"; if(veh.custom) veh.sp=parseFloat(e.target.value); };
  custAg.oninput = e=>{ custAgv.textContent=(+e.target.value).toFixed(1)+"×"; if(veh.custom) veh.ag=parseFloat(e.target.value); };
}
