<div id="cesiumContainer"></div>

<div id="avWrap">✈️</div>
<div id="gauge"><div class="in"><div class="kv" id="gKv">0</div><div class="kd">km/h</div></div></div>
<canvas id="mini" width="118" height="118"></canvas>

  <div style="margin-bottom:8px"><span id="avSizeLbl">크기</span>

  <div id="avGrid" style="display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto"></div>
</div>
<div id="cineTop" class="cinebars"></div>
<div id="cineBot" class="cinebars"></div>

 padding:22px 26px;color:#fff;font-size:14px;line-height:2;min-width:250px;backdrop-filter:blur(8px)"></div>

<div id="tier"></div>

</div>

  </div>
</div>
<div class="hud" id="panel">
  <div id="px" class="ppanel show">
    <div id="searchRow">
      <input id="searchBox" placeholder="장소 검색 — 어디든 (예: 오사카, Uluru)" autocomplete="off">
      <button class="btn" id="btnGo">🔍</button>
    </div>
    <div id="cats"></div>
    <div id="dests"></div>
  </div>

    <div id="custWrap">

      <span>민첩 <output id="custAgv">1.0×</output></span>
      <input type="range" id="custAg" min="0.3" max="3" step="0.1" value="1">
    </div>
  </div>
  <div id="pr" class="ppanel">
    <div id="tracks"></div>
  </div>
  <div id="ps" class="ppanel">
    <div id="moments"></div>
    <div id="films"></div>
    <div id="studioRow">
      <button class="btn" id="btnCity">🏙️ <span id="cityLbl">3D 건물</span></button>
      <button class="btn" id="btnLayer">🌍 <span id="layerLbl">지상/수중 물리</span></button>
      <button class="btn" id="btnRec">📹 <span id="recLbl">녹화</span></button>

      <button class="btn" id="btnCine">🎞️ <span id="cineLbl">시네스코</span></button>

      <button class="btn" id="btnAv">🛩 <span id="avLbl">아바타</span></button>
      <button class="btn" id="btnDream">🌌 <span id="dreamLbl">드림스카이</span></button>
    </div>
  </div>
  <div id="tabbar">
    <button class="tabb on" id="tabX">🌍 탐험</button>
    <button class="tabb" id="tabV">🐉 탈것</button>
    <button class="tabb" id="tabR">🏁 레이스</button>
    <button class="tabb" id="tabS">🎬 연출</button>
  </div>
  <div id="row2">
    <button class="btn" id="btnTour">투어</button>
    <button class="btn" id="btnFree">자유비행</button>
    <button class="btn" id="btnSpace">우주</button>
    <button class="btn" id="btnPhoto">📷 <span id="phLbl">사진</span></button>
    <button class="btn" id="btnStats">📊 <span id="stLbl">일지</span></button>

      <input type="range" id="timeSlider" min="0" max="24" step="0.1" value="17.5">
      <span id="timeLabel">17:30</span>
    </div>
  </div>
</div>

function placeTouchBtns(){
  if(!IS_TOUCH) return;
  const p=document.getElementById("panel");
  if(!p) return;
  const h=Math.round(p.getBoundingClientRect().height)+14;
  const set=(id,extra)=>{const el=document.getElementById(id); if(el) el.style.bottom=(h+extra)+"px";};
  set("btnDrift",0); set("btnBoost",18); set("btnHov",10);
  const av=document.getElementById("avWrap"); if(av) av.style.bottom=(h+4)+"px";
  const gg=document.getElementById("gauge"); if(gg) gg.style.bottom=(h+58)+"px";
}
function setupTouch(){
  placeTouchBtns();
  if(window.ResizeObserver){
    new ResizeObserver(placeTouchBtns).observe(document.getElementById("panel"));
  } else { setInterval(placeTouchBtns, 900); }
  window.addEventListener("resize", placeTouchBtns);
  if(!IS_TOUCH) return;
  const pad=document.getElementById("lookPad");
  let lid=null,px=0,py=0;
  let pinchD=0, pinchF=0;
  const dist2=(e)=>{const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);};
  pad.addEventListener("touchstart",e=>{
    if(e.touches.length===2){ pinchD=dist2(e); pinchF=viewer.camera.frustum.fov; lid=null; e.preventDefault(); return; }
    const t=e.changedTouches[0];lid=t.identifier;px=t.clientX;py=t.clientY;e.preventDefault();},{passive:false});
  pad.addEventListener("touchmove",e=>{
    if(e.touches.length===2 && pinchD>0){
      const nd=dist2(e);
      let f = pinchF * (pinchD/nd);
      f = Math.max(0.52, Math.min(1.92, f));
      viewer.camera.frustum.fov = f;
      e.preventDefault(); return;
    }
    for(const t of e.changedTouches){if(t.identifier===lid){
    touch.lx+=(t.clientX-px)*0.0028; touch.ly+=(t.clientY-py)*0.0028; px=t.clientX;py=t.clientY;}}e.preventDefault();},{passive:false});
  const lend=e=>{for(const t of e.changedTouches){if(t.identifier===lid)lid=null;}};
  pad.addEventListener("touchend",lend); pad.addEventListener("touchcancel",lend);
  const hold=(id,prop,val)=>{const el=document.getElementById(id);
    el.addEventListener("touchstart",e=>{touch[prop]=val;e.preventDefault();},{passive:false});
    const off=()=>{touch[prop]=(prop==="boost")?false:0;};
    el.addEventListener("touchend",off); el.addEventListener("touchcancel",off);};
  document.getElementById("btnHov").addEventListener("touchstart",e=>{
    touch.hover=!touch.hover;
    document.getElementById("btnHov").classList.toggle("on",touch.hover);
    e.preventDefault();},{passive:false});
  hold("btnDrift","drift",true); hold("btnBoost","boost",true); hold("btnBoost","boost",true);
}

const FILMS=[["\uC6D0\uBCF8","Natural"],["\uBE44\uBE44\uB4DC","Vivid"],["\uACE8\uB4E0\uC544\uC6CC","Golden"],["\uC218\uBB35","Ink"],["\uB4DC\uB9BC","Dream"],["\uC544\uBC14\uD0C0","Pandora"],["\uC778\uC149\uC158","Inception"],["\uCF54\uCF54","Coco"],["\uB354 \uD3F4","The Fall"],["\uBD80\uB2E4\uD398\uC2A4\uD2B8","Budapest"],["\uB178\uC744\uAE38","Sunset Drive"],["\uC624\uB85C\uB77C","Aurora"]];
let filmIdx=0, filmStage=null, cityTiles=null, cityLoading=false;
function initFilm(){
  const fs=`uniform sampler2D colorTexture; uniform sampler2D depthTexture; in vec2 v_textureCoordinates; uniform float u_mode; uniform float u_time;
  vec3 sat(vec3 c,float s){float l=dot(c,vec3(0.299,0.587,0.114));return mix(vec3(l),c,s);}
  vec3 filmic(vec3 c){ c=max(vec3(0.0),c-0.004); return (c*(6.2*c+0.5))/(c*(6.2*c+1.7)+0.06); }
  void main(){ vec2 uv=v_textureCoordinates;
    if(u_mode>5.5 && u_mode<6.5 && uv.y>0.45){
      float t=smoothstep(0.45,0.95,uv.y);
      vec2 muv=vec2(uv.x,0.92-uv.y*0.85);
      vec3 a=texture(colorTexture,uv).rgb;
      vec3 b=texture(colorTexture,muv).rgb;
      vec3 c=mix(a,b,smoothstep(0.04,0.5,t));
      c=sat(c,0.8); c=pow(c,vec3(1.15)); c*=vec3(0.88,1.0,1.1);
      out_FragColor=vec4(c,1.0); return;
    }
    vec4 col=texture(colorTexture,uv); vec3 c=col.rgb;
    float l=dot(c,vec3(0.299,0.587,0.114));
    if(u_mode<0.5){ }
    else if(u_mode<1.5){ c=sat(c,1.45); c=pow(c,vec3(0.92)); c*=vec3(1.05,1.0,0.97); }
    else if(u_mode<2.5){ c=sat(c,1.25); c*=vec3(1.18,0.96,0.78); c=pow(c,vec3(0.88)); }
    else if(u_mode<3.5){ c=sat(c,0.12); c=pow(c,vec3(1.3)); c+=vec3(0.02,0.03,0.06); }
    else if(u_mode<4.5){ c=sat(c,1.15); c=c*0.82+0.16; vec2 d=uv-0.5; c*=1.0-dot(d,d)*0.8; }
    else if(u_mode<5.5){
      vec3 glow=pow(max(c-0.5,0.0),vec3(1.0))*vec3(0.3,1.5,1.8);
      c=sat(c,1.35); c=mix(c, c*vec3(0.5,1.15,1.4), 0.5); c+=glow*0.9; c=pow(c,vec3(0.88));
    }
    else if(u_mode<6.5){ c=sat(c,0.8); c=pow(c,vec3(1.15)); c*=vec3(0.88,1.0,1.1); }
    else if(u_mode<7.5){
      c=sat(c,1.3);
      c += (1.0-l)*vec3(0.10,0.015,0.13);
      c *= vec3(1.16,0.94,0.82);
      c += pow(max(c-0.55,0.0),vec3(1.0))*vec3(1.2,0.6,1.1)*0.7;
      c = filmic(c*1.15);
    }
    else if(u_mode<8.5){
      c=sat(c,1.7);
      c = filmic(c*1.25);
      c = c*c*(3.0-2.0*c);
      c *= vec3(1.06,1.0,1.14);
    }
    else if(u_mode<9.5){
      c=sat(c,0.82);
      c = c*0.74 + vec3(0.17,0.11,0.13);
      c = mix(c, c*vec3(1.04,0.94,1.0), 0.5);
      c = pow(c,vec3(1.06));
    }
    else if(u_mode<10.5){
      c=sat(c,1.18);
      c += (0.55-l)*vec3(-0.09,0.015,0.11);
      c *= vec3(1.24,0.96,0.70);
      c = filmic(c*1.18);
      c = max(c, vec3(0.02,0.03,0.05));
    }
    else if(u_mode<11.5){
      float dpt = texture(depthTexture, uv).r;
      vec2 ndc = uv*2.0-1.0;
      vec4 ep = czm_inverseProjection * vec4(ndc, 0.99, 1.0);
      vec3 dirEC = normalize(ep.xyz/ep.w);
      vec3 dirWC = normalize(czm_inverseViewRotation * dirEC);
      vec3 o = czm_viewerPositionWC;
      vec3 radii = vec3(6378137.0, 6378137.0, 6356752.314);
      vec3 oS = o/radii; vec3 dS = dirWC/radii;
      float A2=dot(dS,dS); float B2=2.0*dot(oS,dS); float C2=dot(oS,oS)-1.0;
      float disc=B2*B2-4.0*A2*C2;
      float tHit=(disc>0.0)? (-B2-sqrt(max(disc,0.0)))/(2.0*A2) : -1.0;
      float hit=(tHit>0.0)?1.0:0.0;
      float skyM=(1.0-hit)*step(0.9999999,dpt);
      vec3 up=normalize(o);
      float elv=clamp(dot(dirWC,up),-0.05,1.0);
      vec3 skyCol=mix(vec3(1.0,0.60,0.40), vec3(0.55,0.68,0.95), smoothstep(-0.02,0.14,elv));
      skyCol=mix(skyCol, vec3(0.50,0.29,0.65), smoothstep(0.12,0.5,elv));
      vec3 east=normalize(cross(vec3(0.0,0.0,1.0),up));
      vec3 north=cross(up,east);
      float az=atan(dot(dirWC,east),dot(dirWC,north));
      float b1=sin(az*3.0+elv*7.0+u_time*0.14)*0.5+0.5;
      float b2=sin(az*6.5-u_time*0.09)*0.5+0.5;
      skyCol += vec3(0.08,0.20,0.14)*b1*b2*smoothstep(0.06,0.5,elv);
      c = mix(c, skyCol, skyM*0.9);
      c = sat(c,1.1);
      c = filmic(c*1.05);
    }
    if(u_mode>0.5){
      float g=fract(sin(dot(uv*837.0+vec2(u_time*0.7,u_time*1.3), vec2(12.9898,78.233)))*43758.5453);
      float lum=dot(c,vec3(0.299,0.587,0.114));
      c += (g-0.5)*0.03*(0.25+0.75*smoothstep(0.05,0.5,lum));
    }
    out_FragColor=vec4(c,col.a); }`;
  filmStage=viewer.scene.postProcessStages.add(new Cesium.PostProcessStage({
    fragmentShader:fs, uniforms:{u_mode:()=>filmIdx, u_time:()=>(performance.now()%100000)/1000}}));
  filmStage.enabled=false;
}

let cloudCol=null, cloudMode=0; // 0off 1구름 2운해
function clearClouds(){ if(cloudCol){ viewer.scene.primitives.remove(cloudCol); cloudCol=null; } }
function buildClouds(mode){
  clearClouds();
  if(!Cesium.CloudCollection || mode===0) return;
  cloudCol=viewer.scene.primitives.add(new Cesium.CloudCollection({noiseDetail:16}));
  const pc=viewer.camera.positionCartographic;
  const lon=Cesium.Math.toDegrees(pc.longitude), lat=Cesium.Math.toDegrees(pc.latitude);
  const R=(x)=>x*(Math.random()*2-1);
  if(mode===1){
    for(let i=0;i<38;i++){
      const d=0.008+Math.random()*0.05, ang=Math.random()*6.283;
      cloudCol.add({position:Cesium.Cartesian3.fromDegrees(lon+Math.cos(ang)*d, lat+Math.sin(ang)*d*0.7, pc.height+R(400)),
        scale:new Cesium.Cartesian2(900+Math.random()*1400, 260+Math.random()*320),
        maximumSize:new Cesium.Cartesian3(28,14,18), slice:0.28+Math.random()*0.3,
        brightness:0.95});
    }
  } else {
    const base=Math.max(300, pc.height-450);
    for(let i=0;i<150;i++){
      const d=0.006+Math.random()*0.11, ang=Math.random()*6.283;
      cloudCol.add({position:Cesium.Cartesian3.fromDegrees(lon+Math.cos(ang)*d, lat+Math.sin(ang)*d*0.75, base+R(120)),
        scale:new Cesium.Cartesian2(1600+Math.random()*2600, 340+Math.random()*380),
        maximumSize:new Cesium.Cartesian3(34,16,22), slice:0.32+Math.random()*0.25,
        brightness:1.0});
    }
  }
}
function cycleClouds(){
  cloudMode=(cloudMode+1)%3;
  buildClouds(cloudMode);
  const lbl=document.getElementById("cloudLbl");
  lbl.textContent=cloudMode===0?(KO?"구름":"Clouds"):cloudMode===1?(KO?"구름 ON":"Clouds ON"):(KO?"운해":"Cloud Sea");

}

function burst(lon,lat,h){

let RES_BASE=IS_TOUCH?0.7:1.0, RES_MOVE=IS_TOUCH?0.55:0.8;
let idleT=0;
function dynRes(moving,dt){
  if(moving) idleT=0; else idleT+=dt;
  const tgt = (moving||idleT<0.4)? RES_MOVE : RES_BASE;
  const cur = viewer.resolutionScale;
  const nx = cur + (tgt-cur)*Math.min(1,dt*2.5);
  if(Math.abs(nx-cur)>0.003) viewer.resolutionScale=nx;
  if(window._gT){
    const alt=viewer.camera.positionCartographic.height;
    if(dynRes._band===undefined) dynRes._band=1;
    if(dynRes._band!==0 && alt<450) dynRes._band=0;
    else if(dynRes._band!==2 && alt>2300) dynRes._band=2;
    else if(dynRes._band===0 && alt>650) dynRes._band=1;
    else if(dynRes._band===2 && alt<1800) dynRes._band=1;
    const bandAdj = dynRes._band===0? -2 : dynRes._band===2? 3 : 0;
    const base=(!moving&&idleT>1.2)?(hq?7:9):(hq?10:12);
    const want=Math.max(5, base+bandAdj);
    if(window._gT.maximumScreenSpaceError!==want) window._gT.maximumScreenSpaceError=want;
    const skip = dynRes._band!==0;
    if(window._gT.skipLevelOfDetail!==skip) window._gT.skipLevelOfDetail=skip;
  }
}

    if (Math.abs(touch.sjx)>0.01){ touch.sjx>0 ? c.moveRight(sp*0.7*touch.sjx) : c.moveLeft(sp*0.7*-touch.sjx); }

    const tgtFov = boosting? 74 : driftSt.on? 66 : 60;
    tick._fov = (tick._fov||60) + (tgtFov-(tick._fov||60))*0.08;
    if(c.frustum && c.frustum.fov!==undefined) c.frustum.fov = Cesium.Math.toRadians(tick._fov);
    clampToLayer(c);
    const _vh = (driftSt.on?"\u26A1 ":driftSt.boostT>0?"\uD83D\uDD25 ":"")+`${veh.e} ${dn(veh)} \u00B7 ${(curSpeed()*3.6>=10000? (curSpeed()*3.6/10000).toFixed(1)+"\uB9CC" : Math.round(curSpeed()*3.6).toLocaleString())} km/h`;
    if(_vh!==tick._lastVeh){ tick._lastVeh=_vh; vehHud.textContent=_vh; }
  }
}

function clampToLayer(c){
  if (!layerMode) return;
  const cat = veh.cat || "air";
  if (cat==="air" || cat==="space") return;
  const cart = c.positionCartographic;
  let target = null;
  const g = viewer.scene.globe.getHeight(cart);
  if (cat==="ground"){
    if (g !== undefined) target = g + (veh.off||3);
  } else if (cat==="sea"){
    target = (veh.off||2);
  } else if (cat==="sub"){
    target = Math.min(cart.height, -3);
    if (g !== undefined && g < -10) target = Math.max(target, g+5);
  } else if (cat==="tunnel"){
    target = Math.min(cart.height, (g===undefined?0:g) - 10);
  }
  if (target === null) return;
  const h = cart.height + (target - cart.height)*0.12;
  c.setView({
    destination: Cesium.Cartesian3.fromRadians(cart.longitude, cart.latitude, h),
    orientation: { heading: c.heading, pitch: c.pitch, roll: 0 }
  });
}

function gatePos(g){return Cesium.Cartesian3.fromDegrees(g[0],g[1],g[2]);}

function clearRaceEnts(){
  race.ents.forEach(e=>viewer.entities.remove(e)); race.ents=[];
  if(race.ghostEnt){viewer.entities.remove(race.ghostEnt);race.ghostEnt=null;}
}

function startRace(i){
  const T=TRACKS[i];
  goFree(); race.on=true; race.ti=i; race.gi=0; race.samples=[]; clearRaceEnts();
  race.best=JSON.parse(localStorage.getItem("ef_best_"+i)||"null");
  T.gates.forEach((g,j)=>{
    const pos=gatePos(g);
    const tgt=j<T.gates.length-1?gatePos(T.gates[j+1]):gatePos(T.gates[j-1]);
    const dir=Cesium.Cartesian3.subtract(tgt,pos,new Cesium.Cartesian3());
    const inv=Cesium.Matrix4.inverseTransformation(Cesium.Transforms.eastNorthUpToFixedFrame(pos),new Cesium.Matrix4());
    const loc=Cesium.Matrix4.multiplyByPointAsVector(inv,dir,new Cesium.Cartesian3());
    const ori=Cesium.Transforms.headingPitchRollQuaternion(pos,new Cesium.HeadingPitchRoll(Math.atan2(loc.x,loc.y),0,0));
    race.ents.push(viewer.entities.add({position:pos,orientation:ori,
      ellipsoid:{radii:new Cesium.Cartesian3(T.r,T.r*0.22,T.r),
        material:Cesium.Color.CYAN.withAlpha(0.22),
        outline:true,outlineColor:Cesium.Color.CYAN.withAlpha(0.7)}}));
  });
  race.ents.push(viewer.entities.add({polyline:{
    positions:T.gates.map(g=>gatePos(g)), width:5,
    material:new Cesium.PolylineGlowMaterialProperty({glowPower:0.22,
      color:Cesium.Color.CYAN.withAlpha(0.55)})}}));
  highlightGate();
  if(race.best&&race.best.path&&race.best.path.length>1){
    race.ghostEnt=viewer.entities.add({polyline:{positions:race.best.path.map(q=>new Cesium.Cartesian3(q[0],q[1],q[2])),
      width:3,material:Cesium.Color.GOLD.withAlpha(0.55)}});
  }
  const s0=T.gates[0];
  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(s0[0],s0[1]-0.03,s0[2]+300),
    orientation:{heading:0,pitch:Cesium.Math.toRadians(-5),roll:0}});
  viewer.camera.lookAt(gatePos(s0), new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-4),3000));
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
  race.countdown=3.999; race.cdl=99; raceHud.style.display="block";
}

function highlightGate(){
  race.ents.forEach((e,j)=>{
    const cur=j===race.gi;
    e.ellipsoid.material=(j<race.gi?Cesium.Color.LIME:cur?Cesium.Color.ORANGE:Cesium.Color.CYAN).withAlpha(cur?0.35:0.18);
    e.ellipsoid.outlineColor=(cur?Cesium.Color.ORANGE:Cesium.Color.CYAN).withAlpha(0.8);
  });
}

function endRace(finished){
  if(finished){
    const t=(performance.now()-race.t0)/1000;
    const prev=race.best?race.best.time:Infinity;
    let msg="⏱ "+t.toFixed(2)+"s";
    if(t<prev){ localStorage.setItem("ef_best_"+race.ti,JSON.stringify({time:t,path:race.samples}));
      msg+="<br><small>🏆 "+(KO?"신기록!":"New record!")+(isFinite(prev)?" ("+(KO?"이전 ":"prev ")+prev.toFixed(2)+"s)":"")+"</small>"; }
    else msg+="<br><small>"+(KO?"베스트 ":"Best ")+prev.toFixed(2)+"s</small>";
    sndWin();
    raceHud.innerHTML=msg;
    setTimeout(()=>{raceHud.style.display="none";},4500);
  } else raceHud.style.display="none";
  race.on=false; clearRaceEnts();
}

function raceTick(dt){
  if(!race.on) return;
  if(race.countdown>0){
    race.countdown-=dt;
    const fl=Math.floor(race.countdown);
    if(fl!==race.cdl){race.cdl=fl; fl>=1?sndTick():sndGo();}
    raceHud.innerHTML=race.countdown>1?("🏁 "+Math.floor(race.countdown)):"GO!";
    if(race.countdown<=0){race.t0=performance.now();}
    return;
  }
  const T=TRACKS[race.ti], el=(performance.now()-race.t0)/1000;
  const cp=viewer.camera.position;
  if(race.samples.length===0||el-race.samples[race.samples.length-1][3]>0.25)
    race.samples.push([cp.x,cp.y,cp.z,el]);
  const d=Cesium.Cartesian3.distance(cp,gatePos(T.gates[race.gi]));
  if(d<T.r){
    sndGate();
    race.gi++;
    if(race.gi>=T.gates.length){endRace(true);return;}
    highlightGate();
  }
  const _rh="⏱ "+el.toFixed(1)+"s<br><small>"+(KO?"게이트 ":"Gate ")+race.gi+"/"+T.gates.length+(KO?" · 주황 구체로!":" · to the orange ring!")+"</small>";
  if(_rh!==race._lastHudStr){ race._lastHudStr=_rh; raceHud.innerHTML=_rh; }
}

    gl.translucency.frontFaceAlpha = under?0.45:1.0;
    viewer.scene.screenSpaceCameraController.enableCollisionDetection = !under && !(layerMode && veh.cat==="ground");
  };
  document.getElementById("btnCity").onclick=toggleCity;
  document.getElementById("btnPhoto").onclick=photo;
  document.getElementById("btnStats").onclick=()=>{
    const b=document.getElementById("statsBox");
    if(b.style.display==="block"){b.style.display="none";return;}
    const v=Object.keys(stats.visits).length;
    let bests="";
    TRACKS.forEach((t,i)=>{const r=JSON.parse(localStorage.getItem("ef_best_"+i)||"null");
      if(r)bests+="<br>"+tn(t)+" \u2014 <b>"+r.time.toFixed(2)+"s</b>";});
    b.innerHTML="<b style=\"font-size:16px\">\uD83C\uDF0D \uBE44\uD589\uC77C\uC9C0</b><br>"
      +"\uBC29\uBB38 \uBA85\uC18C: <b>"+v+"</b> / "+DESTS.length
      +"<br>\uCD1D \uBE44\uD589\uAC70\uB9AC: <b>"+(stats.dist/1000).toFixed(1)+" km</b>"
      +(bests?"<br><br><b>\uD83C\uDFC1 \uBCA0\uC2A4\uD2B8</b>"+bests:"")
      +"<br><br><span style=\"opacity:.6;font-size:12px\">\uD0ED\uD558\uBA74 \uB2EB\uD798</span>";
    b.style.display="block";
    b.onclick=()=>b.style.display="none";
  };
  timeSlider.oninput = e=>setLocalTime(parseFloat(e.target.value));
  custSp.oninput = e=>{ custSpv.textContent=(+e.target.value).toFixed(1)+"×"; if(veh.custom) veh.sp=parseFloat(e.target.value); };
  custAg.oninput = e=>{ custAgv.textContent=(+e.target.value).toFixed(1)+"×"; if(veh.custom) veh.ag=parseFloat(e.target.value); };
}
const btnTour=document.getElementById("btnTour"), btnFree=document.getElementById("btnFree"),
      btnSpace=document.getElementById("btnSpace"), timeSlider=document.getElementById("timeSlider"),
      vehHud=document.getElementById("vehHud"), custWrap=document.getElementById("custWrap"),
      custSp=document.getElementById("custSp"), custAg=document.getElementById("custAg"),
      custSpv=document.getElementById("custSpv"), custAgv=document.getElementById("custAgv");

init();
if("serviceWorker" in navigator) navigator.serviceWorker.register("/fly/sw.js");
</script>
<script>window.SWEF={viewer:null,DESTS:null,TRACKS:null,FILMS:null,MOMENTS:null,toast:null,goFree:null,flyToDest:null,setFilm:null,version:"1.0"};</script>
<script src="/fly/modules/index.js" defer id="SWEF_MODULES"></script>
</body>
