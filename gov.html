<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>과태료레이더 — 지금도 쌓이고 있을지 모릅니다</title>
<style>
:root{--bg:#FFF;--surface:#F7F8FA;--line:#E8EAED;--blue:#3182F6;--red:#F04452;
--amber:#B8860B;--amber-bg:#FFF6DF;--red-bg:#FFEDEE;--green:#12B368;
--text:#191F28;--text-2:#4E5968;--muted:#8B95A1;--r:18px;--rs:13px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:'Pretendard',-apple-system,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 70px}
.hero{padding:16px 2px 24px}
h1{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.4}
h1 .r{color:var(--red)}
.sub{font-size:14px;color:var(--text-2);margin-top:8px}
.card{background:var(--surface);border-radius:var(--r);padding:20px 18px;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:15px 0 7px}
label:first-child{margin-top:0}
input,select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--rs);
padding:13px;font-size:15px;color:var(--text);outline:none;font-family:inherit}
input:focus{border-color:var(--blue)}
.row{display:flex;gap:9px}.row>*{flex:1}
.btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--rs);
padding:16px;font-size:16px;font-weight:800;cursor:pointer;margin-top:20px;font-family:inherit}
.btn:active{transform:scale(.985)}
.small{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.7}
.item{background:var(--surface);border-radius:var(--r);padding:17px;margin-bottom:12px;border-left:5px solid var(--line)}
.item.danger{border-left-color:var(--red);background:var(--red-bg)}
.item.warn{border-left-color:var(--amber);background:var(--amber-bg)}
.item.ok{border-left-color:var(--green)}
.it-top{display:flex;align-items:center;gap:9px}
.it-title{font-size:15.5px;font-weight:800;flex:1}
.dday{font-size:13px;font-weight:800;border-radius:999px;padding:4px 11px;background:var(--bg)}
.item.danger .dday{color:var(--red)}.item.warn .dday{color:var(--amber)}.item.ok .dday{color:var(--green)}
.risk{font-size:13.5px;color:var(--text);font-weight:600;margin-top:9px;line-height:1.55}
.item.danger .risk{color:#C0303C}
.act{font-size:12.5px;color:var(--text-2);margin-top:7px}
.note{font-size:11.5px;color:var(--muted);margin-top:4px}
.back{width:100%;background:var(--surface);border:none;color:var(--text-2);border-radius:var(--rs);
padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div id="vForm">
    <div class="hero">
      <h1>지금 이 순간에도<br><span class="r">과태료</span>가 쌓이는 중일지 모릅니다</h1>
      <div class="sub">자동차검사·면허갱신·건강검진·여권 — 30초 입력, 내 행정 기한 전부 확인.</div>
    </div>
    <div class="card">
      <label>출생연도</label>
      <input id="gBirth" type="number" placeholder="예: 1990" min="1930" max="2010">
      <label>운전면허 (있다면)</label>
      <div class="row">
        <select id="gLicType"><option value="">없음/모름</option><option value="1종">1종</option><option value="2종">2종</option></select>
        <input id="gLicYear" type="number" placeholder="취득/최근갱신 연도">
      </div>
      <label>자동차 (있다면)</label>
      <div class="row">
        <input id="gCarReg" placeholder="최초등록 연월 예: 2021-03">
        <input id="gInspYear" type="number" placeholder="최근 검사 연도(선택)">
      </div>
      <label>직장 형태</label>
      <select id="gWorker"><option value="사무직">직장인(사무직)</option><option value="비사무직">직장인(비사무직)</option><option value="지역">그 외(지역가입)</option></select>
      <label>여권 만료 (있다면)</label>
      <input id="gPass" placeholder="예: 2027-05">
      <button class="btn" onclick="scan()">내 기한 스캔하기</button>
      <div class="small">입력 정보는 계산에만 쓰고 저장하지 않아요 · 법정 주기 기반 안내이며 정확한 날짜는 각 기관 조회로 확인하세요</div>
    </div>
  </div>
  <div id="vOut" style="display:none"></div>
</div>
<script>
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function ddayTxt(d){ if(d==null) return ''; if(d<0) return 'D+'+(-d)+' 경과'; if(d===0) return 'D-DAY'; return 'D-'+d; }
async function scan(){
  const body={
    birth_year:+document.getElementById('gBirth').value||null,
    license_type:document.getElementById('gLicType').value||null,
    license_year:+document.getElementById('gLicYear').value||null,
    car_reg:document.getElementById('gCarReg').value.trim()||null,
    last_insp_year:+document.getElementById('gInspYear').value||null,
    worker:document.getElementById('gWorker').value,
    passport_exp:document.getElementById('gPass').value.trim()||null,
  };
  const r=await fetch('/api/gov/plan',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)}).then(x=>x.json()).catch(()=>({ok:false}));
  if(!r.ok||!(r.items||[]).length){ alert('입력을 한 가지 이상 채워주세요'); return; }
  const v=document.getElementById('vOut');
  const danger=r.items.filter(i=>i.level==='danger').length;
  v.innerHTML='<div class="hero"><h1 style="font-size:21px">'+
    (danger? '<span class="r">지금 조치할 것 '+danger+'건</span>이 있어요' : '아직은 안전해요 — 기한을 잡아뒀어요')+
    '</h1></div>'+
    r.items.map(it=>`<div class="item ${it.level}">
      <div class="it-top"><span style="font-size:20px">${it.icon}</span>
        <span class="it-title">${esc(it.title)}</span>
        <span class="dday">${ddayTxt(it.dday)}</span></div>
      <div class="risk">${esc(it.risk)}</div>
      <div class="act">▸ ${esc(it.action)}</div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
    </div>`).join('')+
    '<button class="back" onclick="document.getElementById(\'vOut\').style.display=\'none\';document.getElementById(\'vForm\').style.display=\'\'">다시 입력하기</button>';
  document.getElementById('vForm').style.display='none'; v.style.display='';
  window.scrollTo({top:0});
}
</script>
</body>
</html>
