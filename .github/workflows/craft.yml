name: craft models
# Builds SWEF v2 3D assets (static/fly/v2/models/*.glb) procedurally with headless Blender and commits them.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/craft/**"]
permissions:
  contents: write
concurrency:
  group: craft
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libsm6 > /dev/null
      - run: pip install -q "bpy==5.2.3" numpy
      - run: python tools/craft/build_cockpit.py
      - name: commit models
        run: |
          git config user.name "swef-craft-bot"
          git config user.email "craft@users.noreply.github.com"
          git add static/fly/v2/models
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "craft: models rebuilt from tools/craft"
          git pull --rebase origin main
          git push origin HEAD:main
