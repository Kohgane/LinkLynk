name: Fly v2 Smoke

on:
  pull_request:
    paths:
      - static/fly/v2/**
      - .github/workflows/fly-smoke.yml
  push:
    branches:
      - main
    paths:
      - static/fly/v2/**
      - .github/workflows/fly-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run fly v2 smoke
        run: node static/fly/v2/tests/smoke.mjs
